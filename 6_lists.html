<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists</title>
</head>
<body>

  <ul>
    <li>milk</li>
    <li>bread</li>
    <li>tea</li>
    <ul>
      <li>green tea</li>
      <li>black tea</li> <!-- nested list-->
    </ul>
  </ul>

  <ol>
    <li>wake up</li>
    <li>brush teeth</li>
    <li>go back to sleep</li>
  </ol>

</body>
</html>
