<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elements sorting</title>
</head>
<style>
  .red-bg{
    background-color:red;
  }

</style>

<body>
  <p><span style="background-color: yellow;">This is span, it triggers only elements that are inside, it cant contain other blocks</span></p>
  <p><div style="background-color: yellow;">This is div</div></p>

  <p>here is example with <span class="red-bg">span</span></p>
  <p>here is example with <div class="red-bg">div</div></p>
</body>
</html>
